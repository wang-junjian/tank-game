appId: com.tankgame.app
productName: 坦克大战
artifactName: "${productName}-${version}-${platform}-${arch}.${ext}"
directories:
  output: dist
files:
  - "index.html"
  - "game.js"
  - "images/**/*"
  - "package.json"
  - "electron/main/**/*"
  - "electron/preload/**/*"
  - "!**/node_modules/**"
  - "!**/.git/**"
  - "!**/dist/**"
  - "!**/*.md"
  - "!**/*.txt"
  - "!**/.*"
extraResources:
  - from: "public"
    to: "public"
    filter:
      - "**/*"
mac:
  category: public.app-category.games
  icon: public/icon.png
  executableName: TankBattle
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: public/icon.png
  executableName: TankBattle
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: public/icon.png
  category: Game
  executableName: TankBattle
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
